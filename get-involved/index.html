      <section class="section section--surface" id="contact" data-reveal>
        <div class="container">
          <div class="involve-block">
            <h2>Contact Us</h2>
            <p>Questions, partnerships, or press: send us a message.</p>
          </div>
          <div class="contact-layout">
            <div>
              <!-- No backend: main.js validates the form and shows a thank-you message. See the FORM SERVICE comment in /assets/js/main.js to connect a form service. -->
              <form class="form" id="contact-form" method="post" action="#" novalidate>
                <p class="form__note">Fields marked * are required.</p>
                <div class="field">
                  <label for="contact-name">Name <span aria-hidden="true">*</span></label>
                  <input id="contact-name" name="name" type="text" autocomplete="name" required aria-describedby="contact-name-error">
                  <p class="field__error" id="contact-name-error" hidden><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span class="field__error-text"></span></p>
                </div>
                <div class="field">
                  <label for="contact-email">Email <span aria-hidden="true">*</span></label>
                  <input id="contact-email" name="email" type="email" autocomplete="email" required aria-describedby="contact-email-error">
                  <p class="field__error" id="contact-email-error" hidden><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span class="field__error-text"></span></p>
                </div>
                <div class="field">
                  <label for="contact-organization">Organization <span class="field__hint">(optional)</span></label>
                  <input id="contact-organization" name="organization" type="text" autocomplete="organization">
                </div>
                <div class="field">
                  <label for="contact-message">Message <span aria-hidden="true">*</span></label>
                  <textarea id="contact-message" name="message" rows="6" required aria-describedby="contact-message-error"></textarea>
                  <p class="field__error" id="contact-message-error" hidden><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span class="field__error-text"></span></p>
                </div>
                <div class="form__actions">
                  <button type="submit" class="btn btn--secondary">Send</button>
                </div>
              </form>
              <div class="form-success" id="contact-success" role="status" tabindex="-1" hidden>
                <p>Thanks for your message. We'll be in touch.</p>
              </div>
            </div>
            <aside class="card contact-details" aria-labelledby="contact-details-title">
              <h3 id="contact-details-title">Contact Details</h3>
              <ul class="contact-details__list" role="list">
                <li><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span><a href="mailto:medlinkpathways@gmail.com">medlinkpathways@gmail.com</a></span></li>
